# Enable mouse mode
set-option -g mouse on

# Allow faster key repeats
set-option -s escape-time 0

# Enable the status bar on top
set -g status on
set-option -g status-position top

# Basic styling
# Make status bar transparent (inherit terminal bg)
set -g status-style bg=default,fg=white
set -g status-interval 5

# Show current tmux session and window list
set -g status-left-length 30
set -g status-left " #[bold]#S | "  # Session name

set -g status-right '#[bold]sanjeevi'

# Style for window titles
setw -g window-status-format "#I:#W"
setw -g window-status-current-format "#[bold]#[fg=green] #I:#W #[default]"

# Split panes using easier shortcuts
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Resize panes using Ctrl + arrow keys
bind -n C-Left resize-pane -L 5
bind -n C-Right resize-pane -R 5
bind -n C-Up resize-pane -U 5
bind -n C-Down resize-pane -D 5

unbind -n M-h
unbind -n M-j
unbind -n M-k
unbind -n M-l
	
# Reload config file with Ctrl+a r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Set history limit
set-option -g history-limit 10000

bind-key C-k send-keys 'clear && printf "\033[3J"' Enter

# Enable vi mode for copy
set-option -g mode-keys vi

# Enable clipboard integration (if tmux is compiled with it)
set-option -g set-clipboard on

# Detach from session with prefix + d
bind d detach

# Exit when no sessions remain
set-option -g exit-empty on

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @vim_navigator_mapping_left "C-Left C-h"  # use C-h and C-Left
set -g @vim_navigator_mapping_right "C-Right C-l"
set -g @vim_navigator_mapping_up "C-k"
set -g @vim_navigator_mapping_down "C-j"
set -g @vim_navigator_mapping_prev ""  # removes the C-\ binding
set -g @plugin 'vndmp4/tmux-fzf-session-switch'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
